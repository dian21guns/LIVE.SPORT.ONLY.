name: Android Build APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Show Gradle/SDK diagnostics
        run: |
          java -version
          gradle -v
          sdkmanager --list | head -n 40

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --warning-mode all

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dpch21tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Gradle problem reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problem-reports
          path: |
            build/reports/problems/
            **/build/reports/problems/
